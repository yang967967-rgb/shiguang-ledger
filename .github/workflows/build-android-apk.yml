name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icons/**"
      - "assets/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-web.js"
      - "scripts/configure-android.js"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Keep Android signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shiguang-ledger-debug-key-v1

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled web app
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android app icon
        run: node scripts/configure-android.js
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Read app version
        id: app-version
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "shiguang-ledger-v${{ steps.app-version.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-ledger-v${{ steps.app-version.outputs.version }}-android
          path: shiguang-ledger-v${{ steps.app-version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30
